# config.toml
# Archivo de configuración centralizado para el pipeline ETL de TripAdvisor

[airflow]
owner = "jorge-de-dios"
retries = 1
retry_delay_minutes = 2

# -----------------------------------------------------------------------------
# Rutas del proyecto (relativas, portables entre máquinas)
# 'data_dir' se resuelve contra la raíz del proyecto (variable SDPD2_HOME o, por
# defecto, la raíz del repositorio). El resto de rutas se resuelven contra 'data_dir'.
# Cualquier ruta absoluta se respeta tal cual.

[paths]
data_dir = "data"
raw_csv = "tripadvisor_european_restaurants.csv"
# Datos validados tras la auditoría de calidad (entrada de la fase de transformación)
clean_parquet = "cleaned_data.parquet"
# Ruta para el Data Lake particionado (datos limpios)
partitioned_dir = "processed_lake"
# Ruta para la Dead Letter Queue (datos corruptos)
dlq_parquet = "dlq/corrupted_records.parquet"
watermark_file = "watermark.json"
# -----------------------------------------------------------------------------
# Configuración del clúster de Kafka (Docker local)

[kafka]
bootstrap_servers = "localhost:9092"
topic_name = "tripadvisor_restaurants"
acks = "all"
# Límite de demostración: registros publicados por ejecución del DAG.
# Un broker local de un solo nodo no necesita el millón de filas para demostrar
# el flujo. Súbelo, o pon 0 para publicar el dataset completo.
max_records_per_run = 5000

# -----------------------------------------------------------------------------
# Parámetros para la limpieza y Feature Engineering

[processing]
# Columnas críticas: si falta alguna, descartamos el registro (No Data Leakage)
critical_columns = ["restaurant_name", "country", "latitude", "longitude"]

# Columnas numéricas: rellenamos valores nulos con 0
numeric_columns = ["avg_rating", "total_reviews_count"]

# Columnas de listas a transformar (mantenido por si se necesita escalar en el futuro)
list_columns = ["cuisines"]
